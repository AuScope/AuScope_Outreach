name: Daily AuSIS Station Backup

# Rebuilds data/ausis_stations.geojson (station metadata + latest-data
# timestamps) from EarthScope's FDSN services, server-side. This committed
# file is the map's ONLY station source — the browser never calls EarthScope
# (their June 2026 migration broke browser CORS, not curl/urllib).
#
# FAILS LOUD: if either fetch fails the file is left untouched, the run goes
# red and an issue is auto-filed — never silently written with missing data.

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC (4pm AEST)
  workflow_dispatch:       # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch AuSIS stations and availability from EarthScope FDSN
        run: |
          python3 << 'EOF'
          import json, urllib.request, datetime, sys

          FDSN = 'https://service.earthscope.org'

          # Step 1: Fetch station metadata
          url = FDSN + '/fdsnws/station/1/query?network=S1&level=station&format=text'
          try:
              resp = urllib.request.urlopen(url, timeout=30)
              lines = resp.read().decode('utf-8').strip().split('\n')
          except Exception as e:
              print(f'ERROR: station fetch failed: {e}')
              sys.exit(1)   # keep yesterday's file; a red run beats silent staleness

          stations = {}
          for line in lines[1:]:
              parts = line.split('|')
              if len(parts) < 7:
                  continue
              code = parts[1].strip()
              if code == 'TEST':
                  continue
              lat = float(parts[2].strip())
              lng = float(parts[3].strip())
              stations[code] = {
                  "code": code,
                  "name": parts[5].strip(),
                  "elevation": float(parts[4].strip()),
                  "startTime": parts[6].strip(),
                  "endTime": parts[7].strip() if len(parts) > 7 and parts[7].strip() else None,
                  "latestData": None,
                  "lat": lat,
                  "lng": lng
              }

          if len(stations) == 0:
              print('ERROR: no stations returned — keeping existing backup')
              sys.exit(1)

          # Step 2: Fetch availability (latest data timestamps). Required —
          # without it every station would render as "unknown" on the map.
          avail_url = FDSN + '/fdsnws/availability/1/extent?network=S1&channel=BH?,HH?&format=text'
          try:
              resp = urllib.request.urlopen(avail_url, timeout=30)
              avail_lines = resp.read().decode('utf-8').strip().split('\n')
          except Exception as e:
              print(f'ERROR: availability fetch failed: {e}')
              sys.exit(1)

          for line in avail_lines[1:]:
              cols = line.strip().split()
              if len(cols) < 8:
                  continue
              code = cols[1]
              end_time = cols[7]
              if code in stations:
                  current = stations[code]["latestData"]
                  if current is None or end_time > current:
                      stations[code]["latestData"] = end_time

          # Step 3: Build GeoJSON
          features = []
          for s in stations.values():
              features.append({
                  "type": "Feature",
                  "properties": {
                      "code": s["code"],
                      "name": s["name"],
                      "elevation": s["elevation"],
                      "startTime": s["startTime"],
                      "endTime": s["endTime"],
                      "latestData": s["latestData"]
                  },
                  "geometry": {
                      "type": "Point",
                      "coordinates": [s["lng"], s["lat"]]
                  }
              })

          geojson = {
              "type": "FeatureCollection",
              "metadata": {
                  "source": "EarthScope FDSN station + availability services",
                  "network": "S1",
                  "fetched": datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              },
              "features": features
          }

          with open('data/ausis_stations.geojson', 'w') as f:
              json.dump(geojson, f, indent=2)

          avail_count = sum(1 for s in stations.values() if s["latestData"])
          print(f'Saved {len(features)} stations ({avail_count} with availability data)')
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ausis_stations.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Daily AuSIS station backup $(date -u +%Y-%m-%d)"
            # Another hourly job may have pushed to main since checkout —
            # rebase (disjoint files) so the push can't fail non-fast-forward.
            git pull --rebase -q origin main
            git push
          fi

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Pipeline failure: ${{ github.workflow }}"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' 2>/dev/null || true)
          body="Scheduled run failed at $(date -u +%FT%TZ): $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body

          Auto-filed by the workflow's failure alert. Close once the pipeline is green again."
          fi
