name: Daily AuSIS Station Backup

# Rebuilds data/ausis_stations.geojson (station metadata + latest-data
# timestamps) server-side. The map and every widget read this committed file
# - the browser never calls a third-party API.
#
# EarthScope RETIRED fdsnws-availability on 2026-07-27 (HTTP 410, Seattle
# datacenter decommissioning; replacement "not ready before the legacy
# system is turned off"). latestData is now derived without it:
#   1. the hourly waveform manifest (proof of streaming, precise end times)
#   2. dataselect day-slice probes for stations not in the manifest
#   3. the previous file's value for long-quiet stations (history preserved)
#
# FAILS LOUD: no stations, or zero stations with recent data, leaves the
# file untouched, goes red and auto-files an issue.

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC (4pm AEST)
  workflow_dispatch:       # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild station file (station service + manifest + probes)
        run: |
          python3 << 'EOF'
          import json, urllib.request, datetime, sys

          FDSN = 'https://service.earthscope.org'
          MANIFEST = ('https://raw.githubusercontent.com/AuScope/'
                      'AuScope_Outreach/waveforms/manifest.json')
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)

          # Step 1: station metadata (required)
          url = FDSN + '/fdsnws/station/1/query?network=S1&level=station&format=text'
          try:
              resp = urllib.request.urlopen(url, timeout=30)
              lines = resp.read().decode('utf-8').strip().split('\n')
          except Exception as e:
              print(f'ERROR: station fetch failed: {e}')
              sys.exit(1)

          stations = {}
          for line in lines[1:]:
              parts = line.split('|')
              if len(parts) < 7:
                  continue
              code = parts[1].strip()
              if code == 'TEST':
                  continue
              stations[code] = {
                  "code": code,
                  "name": parts[5].strip(),
                  "elevation": float(parts[4].strip()),
                  "startTime": parts[6].strip(),
                  "endTime": parts[7].strip() if len(parts) > 7 and parts[7].strip() else None,
                  "latestData": None,
                  "lat": float(parts[2].strip()),
                  "lng": float(parts[3].strip()),
              }
          if not stations:
              print('ERROR: no stations returned - keeping existing backup')
              sys.exit(1)

          # Step 2: previous values (preserved for long-quiet stations)
          prev = {}
          try:
              with open('data/ausis_stations.geojson') as fh:
                  for ft in json.load(fh).get('features', []):
                      prev[ft['properties']['code']] = ft['properties'].get('latestData')
          except Exception:
              pass

          # Step 3: hourly waveform manifest - precise end times for streamers
          man = {}
          try:
              with urllib.request.urlopen(MANIFEST, timeout=30) as r:
                  m = json.load(r)
              man = {k: v.get('end') for k, v in (m.get('stations') or {}).items()
                     if v.get('end')}
              print(f'manifest: {len(man)} station end-times '
                    f'(generated {m.get("generated")})')
          except Exception as e:
              print(f'WARNING: manifest read failed ({e}) - probes only')

          # Step 4: dataselect day-slice probes for the rest
          def has_data(code, t0, t1):
              u = (f'{FDSN}/fdsnws/dataselect/1/query?network=S1&station={code}'
                   f'&channel=HHZ,BHZ&nodata=404'
                   f"&starttime={t0.strftime('%Y-%m-%dT%H:%M:%S')}"
                   f"&endtime={t1.strftime('%Y-%m-%dT%H:%M:%S')}")
              try:
                  req = urllib.request.Request(u, method='HEAD')
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status == 200
              except Exception:
                  return False

          probed = 0
          for code, s in stations.items():
              if man.get(code):
                  s['latestData'] = man[code]
                  continue
              if s['endTime']:
                  s['latestData'] = prev.get(code)
                  continue
              probed += 1
              found = None
              for d in range(7):
                  t1 = now - datetime.timedelta(days=d)
                  t0 = t1 - datetime.timedelta(days=1)
                  if has_data(code, t0, t1):
                      found = t0.strftime('%Y-%m-%dT%H:%M:%SZ')
                      break
              s['latestData'] = found or prev.get(code)
          print(f'probed {probed} station(s) not in the manifest')

          # Fail-loud sanity: if NOTHING looks recent, something upstream is
          # broken - do not publish a file that would yellow the whole map.
          def fresh(ts):
              try:
                  dt = datetime.datetime.fromisoformat(str(ts).replace('Z', ''))
                  return (now - dt).days < 2
              except Exception:
                  return False
          n_fresh = sum(1 for s in stations.values() if fresh(s['latestData']))
          print(f'{n_fresh} station(s) with data in the last 2 days')
          if n_fresh == 0:
              print('ERROR: zero stations with recent data - refusing to publish')
              sys.exit(1)

          features = [{
              "type": "Feature",
              "properties": {k: s[k] for k in
                             ("code", "name", "elevation", "startTime",
                              "endTime", "latestData")},
              "geometry": {"type": "Point", "coordinates": [s["lng"], s["lat"]]},
          } for s in stations.values()]

          geojson = {
              "type": "FeatureCollection",
              "metadata": {
                  "source": "EarthScope station service + waveform manifest + dataselect probes",
                  "network": "S1",
                  "fetched": now.strftime('%Y-%m-%dT%H:%M:%SZ'),
              },
              "features": features,
          }
          with open('data/ausis_stations.geojson', 'w') as fh:
              json.dump(geojson, fh, indent=2)
          print(f'Saved {len(features)} stations')
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ausis_stations.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Daily AuSIS station backup $(date -u +%Y-%m-%d)"
            # Another hourly job may have pushed to main since checkout -
            # rebase (disjoint files) so the push can't fail non-fast-forward.
            git pull --rebase -q origin main
            git push
          fi

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Pipeline failure: ${{ github.workflow }}"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' 2>/dev/null || true)
          body="Scheduled run failed at $(date -u +%FT%TZ): $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body

          Auto-filed by the workflow's failure alert. Close once the pipeline is green again."
          fi
