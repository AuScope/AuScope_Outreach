name: Hourly AuSIS Status Check

# Server-side "is it really streaming?" check, availability-free since
# EarthScope retired fdsnws-availability on 2026-07-27 (HTTP 410):
# a station in the FRESH hourly waveform manifest is streaming by proof;
# every other active station gets a dataselect last-24h probe. Result is
# committed to data/ausis_status.json for the map/widgets (same-origin).
#
# FAILS LOUD on a broken station file; probe errors mark a station
# not-streaming rather than crashing the run.

on:
  schedule:
    - cron: '15 * * * *'  # Every hour at :15 (off the congested :00 slot)
  workflow_dispatch:       # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Probe stations not proven by the waveform manifest
        run: |
          python3 << 'EOF'
          import json, urllib.request, datetime, sys

          FDSN = 'https://service.earthscope.org'
          MANIFEST = ('https://raw.githubusercontent.com/AuScope/'
                      'AuScope_Outreach/waveforms/manifest.json')
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          checked = now.strftime('%Y-%m-%dT%H:%M:%SZ')

          try:
              with open('data/ausis_stations.geojson') as fh:
                  feats = json.load(fh)['features']
          except Exception as e:
              print(f'ERROR: cannot read station file: {e}')
              sys.exit(1)
          active = [f['properties']['code'] for f in feats
                    if not f['properties'].get('endTime')]

          proven = set()
          try:
              with urllib.request.urlopen(MANIFEST, timeout=30) as r:
                  m = json.load(r)
              gen = m.get('generated')
              age_h = ((now - datetime.datetime.fromisoformat(
                  str(gen).replace('Z', ''))).total_seconds() / 3600
                  if gen else 99)
              if age_h <= 6:      # cron drops make 2-5 h gaps normal
                  proven = set((m.get('stations') or {}).keys())
              print(f'manifest {age_h:.1f} h old - {len(proven)} proven streaming')
          except Exception as e:
              print(f'WARNING: manifest unavailable ({e}) - probing everything')

          to_probe = [c for c in active if c not in proven]
          print(f'probing {len(to_probe)} station(s)')

          yesterday = (now - datetime.timedelta(days=1)).strftime('%Y-%m-%dT%H:%M:%S')
          today = now.strftime('%Y-%m-%dT%H:%M:%S')
          stations = {}
          for code in to_probe:
              url = (f'{FDSN}/fdsnws/dataselect/1/query?network=S1'
                     f'&station={code}&channel=HHZ,BHZ&nodata=404'
                     f'&starttime={yesterday}&endtime={today}')
              streaming = False
              try:
                  req = urllib.request.Request(url, method='HEAD')
                  with urllib.request.urlopen(req, timeout=15) as r:
                      streaming = (r.status == 200)
              except Exception:
                  streaming = False
              stations[code] = {'streaming': streaming, 'checkedAt': checked}
              print(f'  {code}: {"STREAMING" if streaming else "quiet"}')
          for code in proven:
              stations[code] = {'streaming': True, 'checkedAt': checked}

          with open('data/ausis_status.json', 'w') as fh:
              json.dump({'checked': checked, 'stations': stations}, fh, indent=2)
          print(f'Saved status for {len(stations)} station(s)')
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ausis_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Hourly AuSIS status check $(date -u +%Y-%m-%dT%H:%M)"
            # Another hourly job may have pushed to main since checkout -
            # rebase (disjoint files) so the push can't fail non-fast-forward.
            git pull --rebase -q origin main
            git push
          fi

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Pipeline failure: ${{ github.workflow }}"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' 2>/dev/null || true)
          body="Scheduled run failed at $(date -u +%FT%TZ): $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body

          Auto-filed by the workflow's failure alert. Close once the pipeline is green again."
          fi
