name: Hourly earthquake store

# Fetches Geoscience Australia's recent-earthquakes feed, merges it (by event
# id, newest version wins) into a 24-month rolling store, and commits the
# result to main. Kept separate from the waveforms workflow because this is a
# normal commit to main, whereas waveforms force-pushes a flat orphan branch.

on:
  schedule:
    - cron: "20 * * * *"      # 20 min past each hour (offset from waveforms)
  workflow_dispatch:

concurrency:
  group: quakes
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update earthquake store
        run: python scripts/update_quakes.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/earthquakes_24mo.geojson
          if ! git diff --cached --quiet; then
            git commit -q -m "earthquake store $(date -u +%FT%TZ)"
            # Another hourly job may have pushed to main since checkout -
            # rebase (disjoint files) so the push can't fail non-fast-forward.
            git pull --rebase -q origin main
            git push
          else
            echo "No change to the earthquake store this run."
          fi

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Pipeline failure: ${{ github.workflow }}"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' 2>/dev/null || true)
          body="Scheduled run failed at $(date -u +%FT%TZ): $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body

          Auto-filed by the workflow's failure alert. Close once the pipeline is green again."
          fi
