name: Hourly earthquake store

# Fetches Geoscience Australia's recent-earthquakes feed, merges it (by event
# id, newest version wins) into a 6-month rolling store, and commits the
# result to main. Kept separate from the waveforms workflow because this is a
# normal commit to main, whereas waveforms force-pushes a flat orphan branch.

on:
  schedule:
    - cron: "20 * * * *"      # 20 min past each hour (offset from waveforms)
  workflow_dispatch:

concurrency:
  group: quakes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update earthquake store
        run: python scripts/update_quakes.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "--- file on disk ---"
          ls -la data/ || echo "NO data/ DIRECTORY"
          echo "--- is it gitignored? ---"
          git check-ignore -v data/earthquakes_24mo.geojson || echo "not ignored"
          echo "--- git status ---"
          git status --porcelain
          echo "--------------------"
          git add -f data/earthquakes_24mo.geojson
          if ! git diff --cached --quiet; then
            git commit -q -m "earthquake store $(date -u +%FT%TZ)"
            git push
          else
            echo "Nothing staged to commit."
          fi


