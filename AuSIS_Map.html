<!DOCTYPE html>
<!--
  AuSIS_Map.html
  Interactive map of AuSIS (Australian Seismometers In Schools) stations.
  FDSN Network DOI: 10.7914/SN/S1

  Data model: the browser makes NO third-party API calls. Station metadata,
  availability-derived status, waveform plots and the earthquake catalogue are
  all produced by scheduled GitHub Actions (see .github/workflows/ and
  scripts/) and read either same-origin from data/ or from this repo's
  force-pushed `waveforms` / `event-waveforms` branches on
  raw.githubusercontent.com. Upstream services (EarthScope FDSN, Geoscience
  Australia) are only ever contacted server-side, where redirects and missing
  CORS headers cannot break the page — the June 2026 EarthScope migration
  (service.iris.edu -> service.earthscope.org, 307 without CORS headers)
  broke exactly the browser-side fetches this design removes.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuSIS Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; height: 100vh; }
/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  background: #282572; color: #fff; padding: 4px 16px; min-height: 36px;
}
.header-title { font-size: 18px; font-weight: 400; letter-spacing: 0.3px; }
.header-logo img { height: 36px; }
/* Map */
#map { flex: 1; width: 100%; position: relative; }
#fs-btn {
  position: absolute; top: 10px; right: 10px; z-index: 1000;
  width: 34px; height: 34px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.92); border: 2px solid rgba(0,0,0,0.2);
  border-radius: 4px; cursor: pointer; color: #282572;
}
#fs-btn:hover { background: #fff; }
#fs-btn svg { display: block; }
:fullscreen #fs-btn .fs-open { display: none; }
:fullscreen #fs-btn .fs-close { display: block; }
#fs-btn .fs-close { display: none; }
/* Popups */
.leaflet-popup-content-wrapper { opacity: 0.85 !important; }
.leaflet-popup-content { margin: 10px 14px !important; font-family: Arial, Helvetica, sans-serif; font-size: 13px; line-height: 1.6; }
.popup-title { font-weight: 700; font-size: 14px; color: #282572; margin-bottom: 4px; text-align: center; }
.popup-code { font-family: monospace; font-size: 12px; color: #2563eb; background: #eff6ff; padding: 1px 6px; border-radius: 3px; display: inline-block; margin-right: 6px; }
.popup-row { color: #4b5563; font-size: 12px; }
.popup-row strong { color: #374151; }
/* Waveform block inside station popups */
.wf { margin-top: 8px; width: 332px; max-width: 100%; }
.wf-head { display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.wf-label { font-size: 11px; font-weight: 700; color: #282572; text-transform: uppercase; letter-spacing: 0.4px; }
.wf-seg { display: flex; width: auto; margin: 0 -14px 4px; border: 1px solid #cbd5e1; border-left: none; border-right: none; border-radius: 0; overflow: hidden; }
.wf-seg-btn { flex: 1; font-family: inherit; font-size: 11px; padding: 4px 0; border: none; border-left: 1px solid #cbd5e1; background: #fff; color: #475569; cursor: pointer; }
.wf-seg-btn:first-child { border-left: none; }
.wf-seg-btn:hover { background: #eff6ff; }
.wf-seg-btn.active { background: #282572; color: #fff; font-weight: 700; }
.wf-frame { position: relative; width: auto; min-height: 92px; margin: 0 -14px; background: #f8fafc; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; overflow: hidden; }
.wf-frame img.wf-img { display: block; width: 100%; height: auto; opacity: 0; transition: opacity 0.2s; }
.wf-frame.loaded img.wf-img { opacity: 1; }
.wf-frame.loaded .wf-status { display: none; }
.wf-frame.failed img.wf-img { display: none; }
.wf-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #64748b; text-align: center; padding: 8px; }
.wf-frame.failed .wf-status { font-size: 0; font-style: normal; }
.wf-frame.failed .wf-status::after { content: "Waveform image unavailable right now — plots refresh hourly, so try again shortly."; font-size: 11px; }
.wf-foot { font-size: 10px; color: #94a3b8; margin-top: 3px; }
/* Earthquake popups */
.q-title { font-weight: 700; font-size: 15px; color: #b91c1c; margin-bottom: 2px; }
.q-place { font-size: 12px; color: #374151; margin-bottom: 6px; }
.q-row { font-size: 12px; color: #4b5563; }
.q-row strong { color: #374151; }
.q-near { margin-top: 6px; font-size: 11px; color: #4b5563; }
.q-near b { color: #282572; }
.q-section { margin-top: 8px; }
.q-section-label { font-size: 11px; font-weight: 700; color: #282572; margin-bottom: 4px; text-align: center; }
.q-section-img { display: block; width: 360px; max-width: none; margin: 0 -14px; height: auto; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }

/* Three size tiers, driven by the `medium` / `enlarged` classes the size
   detector puts on #map. The Leaflet popup maxWidth option is raised (700)
   so the larger tiers have room; CSS constrains content per tier. Source
   PNGs are rendered at 2x DPI so even the large tier stays sharp.
     compact  (embed ~644)         : 332 / 360   — unchanged baseline
     medium   (small laptop)       : 424 / 452   — scaled middle step
     large    (fullscreen/new-tab) : 509 / 531   — was 636/664, −20%        */
.leaflet-popup-content { max-width: 332px; }                       /* compact */
#map.medium   .leaflet-popup-content { max-width: 452px; }
#map.medium   .wf            { width: 424px; }
#map.medium   .q-section-img { width: 452px; }
#map.enlarged .leaflet-popup-content { max-width: 531px; }
#map.enlarged .wf            { width: 509px; }
#map.enlarged .q-section-img { width: 531px; }
@media (max-width: 700px) {       /* never exceed a small physical screen */
  #map.medium .leaflet-popup-content,
  #map.enlarged .leaflet-popup-content { max-width: 332px; }
  #map.medium .wf, #map.enlarged .wf { width: 332px; }
  #map.medium .q-section-img, #map.enlarged .q-section-img { width: 360px; }
}
/* Latest-earthquake spotlight chip */
#spotlight {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  z-index: 1000; display: none; align-items: center; gap: 8px;
  max-width: min(86%, 560px); padding: 6px 10px 6px 12px;
  background: rgba(255,255,255,0.95); border: 2px solid rgba(0,0,0,0.2);
  border-radius: 6px; cursor: pointer; font-size: 12px; color: #282572;
  box-shadow: 0 1px 5px rgba(0,0,0,0.3); white-space: nowrap; overflow: hidden;
}
#spotlight.on { display: flex; }
#spotlight:hover { background: #fff; }
#spotlight .sp-mag { font-weight: 700; color: #b91c1c; }
#spotlight .sp-text { overflow: hidden; text-overflow: ellipsis; }
#spotlight .sp-close { border: none; background: none; font-size: 14px; color: #94a3b8; cursor: pointer; padding: 0 2px; }
#spotlight .sp-close:hover { color: #333; }
/* Distance/travel-time labels on quake connector lines */
.q-conn-label {
  background: rgba(255,255,255,0.9); border-radius: 3px; padding: 1px 5px;
  font-size: 10px; color: #7f1d1d; white-space: nowrap; width: max-content !important;
  border: 1px solid rgba(185,28,28,0.35); font-family: Arial, Helvetica, sans-serif;
}
/* Controls — hidden by default for clean map view */
.leaflet-control-zoom { display: none !important; }
.toolbar-wrap, .toolbar-wrap .leaflet-bar { background: none !important; border: none !important; box-shadow: none !important; }
.tools-toggle { display: block; width: 30px; height: 30px; line-height: 30px; text-align: center; background: rgba(255,255,255,0.3); border-radius: 4px; border: 2px solid rgba(0,0,0,0.2); cursor: pointer; font-size: 18px; color: #333; text-decoration: none; }
.tools-toggle:hover { background: rgba(255,255,255,0.95); }
.toolbar-buttons { display: none; margin-top: 4px; }
.toolbar-buttons.open { display: block; }
.btn-group { margin-top: 4px; }
.btn-group:first-child { margin-top: 0; }
.btn-group a { display: block; width: 30px; height: 30px; line-height: 30px; text-align: center; background: #fff; border: 2px solid rgba(0,0,0,0.2); cursor: pointer; text-decoration: none; }
.btn-group a:first-child { border-radius: 4px 4px 0 0; }
.btn-group a + a { border-top: none; }
.btn-group a:last-child { border-radius: 0 0 4px 4px; }
.btn-group a:only-child { border-radius: 4px; }
.btn-group a:hover { background: #f0f0f0; }
.btn-group a.active { background: #fee2e2; }
.search-panel { display: none; background: #fff; border-radius: 6px; border: 2px solid rgba(0,0,0,0.2); box-shadow: 0 1px 5px rgba(0,0,0,0.4); padding: 4px 10px; margin-top: 6px; }
.search-panel.open { display: block; }
.search-panel input { border: none; outline: none; font-family: Arial, Helvetica, sans-serif; font-size: 13px; width: 200px; }
.search-results { max-height: 200px; overflow-y: auto; margin-top: 4px; }
.search-results div { padding: 4px 6px; cursor: pointer; font-size: 12px; border-radius: 3px; font-family: Arial, Helvetica, sans-serif; }
.search-results div:hover { background: #eff6ff; }
.quake-win-panel { display: none; background: #fff; border-radius: 6px; border: 2px solid rgba(0,0,0,0.2); box-shadow: 0 1px 5px rgba(0,0,0,0.4); padding: 6px 10px; margin-top: 6px; font-family: Arial, Helvetica, sans-serif; }
.quake-win-panel.open { display: block; }
.quake-win-panel label { display: block; font-size: 11px; color: #6b7280; margin-bottom: 3px; }
.quake-win-panel select { font-family: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; color: #282572; cursor: pointer; width: 100%; }
/* Footer / Legend */
.footer {
  display: flex; align-items: center; justify-content: center; gap: 24px;
  background: #282572; color: #fff; padding: 6px 16px; min-height: 36px;
  font-family: Arial, Helvetica, sans-serif; font-size: 12px;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-icon { display: inline-block; }
.legend-quakes { cursor: pointer; transition: opacity 0.15s; }
.legend-quakes.off { opacity: 0.45; }
.quake-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ef4444; border: 1px solid #fff; }
#stale-badge { color: #fbbf24; font-size: 11px; }
@media (max-width: 600px) {
  .header-title { font-size: 14px; }
  .footer { flex-wrap: wrap; gap: 12px; font-size: 11px; }
}
</style>
</head>
<body>
<div class="header">
  <span class="header-title"><span id="header-title">AuSIS Map</span></span>
  <span class="header-logo"><img src="assets/auscope-logo.png" alt="AuScope"></span>
</div>
<div id="map">
  <div id="spotlight" role="button" tabindex="0" title="Show this earthquake on the map">
    <span class="sp-mag"></span><span class="sp-text"></span>
    <button class="sp-close" type="button" aria-label="Dismiss" title="Dismiss">&times;</button>
  </div>
  <button id="fs-btn" type="button" title="Fullscreen" aria-label="Toggle fullscreen">
    <svg class="fs-open" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5V2.5h4M16 6.5V2.5h-4M2 11.5v4h4M16 11.5v4h-4"/></svg>
    <svg class="fs-close" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5v4H2M12 2.5v4h4M6 15.5v-4H2M12 15.5v-4h4"/></svg>
  </button>
</div>
<div class="footer">
  <span class="legend-item"><span class="legend-icon" id="legend-streaming"></span> <span id="legend-streaming-text">Live streaming</span></span>
  <span class="legend-item"><span class="legend-icon" id="legend-offline"></span> Intermittent</span>
  <span class="legend-item"><span class="legend-icon" id="legend-ended"></span> Decommissioned</span>
  <span class="legend-item legend-quakes" id="legend-quakes" title="Show or hide recent earthquakes — red: last 24 h, orange: last 7 days, yellow: older. Circle size = magnitude."><span class="quake-dot"></span> <span id="legend-quakes-text">Earthquakes</span></span>
  <span id="stale-badge" style="display:none"></span>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// ── Constants ─────────────────────────────────────────────────
const LIVE_THRESHOLD_DAYS = 7;    // latestData within this = "Live streaming"
const STATUS_STALE_HOURS  = 48;   // committed status older than this = show badge, ignore overrides
const WAVEFORM_FRESH_HOURS = 3;   // manifest older than this no longer proves a station is live

// Waveform (last-hour) settings
// The plots are pre-rendered hourly by a GitHub Action
// (scripts/render_waveforms.py, data from EarthScope) and published to the
// force-pushed `waveforms` branch. The map just shows the PNG.
// NOTE: WAVEFORM_REPO is the ONE value that must match the hosting repo.
// It must be the exact owner/repo as it appears in the GitHub URL
// (case-sensitive on raw.githubusercontent.com) and the repo must be PUBLIC.
const WAVEFORM_MINUTES = 60;                       // length of trace shown
const WAVEFORM_REPO    = 'AuScope/AuScope_Outreach'; // owner/repo — VERIFY exact casing
const WAVEFORM_BRANCH  = 'waveforms';              // branch holding the PNGs
const WAVEFORM_BASE    = 'https://raw.githubusercontent.com/'
                       + WAVEFORM_REPO + '/' + WAVEFORM_BRANCH + '/';
const EVENT_WF_BRANCH  = 'event-waveforms';        // branch holding event record sections
const EVENT_WF_BASE    = 'https://raw.githubusercontent.com/'
                       + WAVEFORM_REPO + '/' + EVENT_WF_BRANCH + '/';
const WAVEFORM_NEAR_LIST  = 3;                     // # of nearest stations listed in a quake popup
const WAVEFORM_NEAR_LINKS = 5;                     // # of nearest stations to draw dashed lines to

// Earthquake layer settings.
// Data is the 24-month rolling store built hourly from Geoscience Australia
// (scripts/update_quakes.py), committed to data/ on main. Read same-origin —
// no cross-origin call to GA from the browser.
const QUAKE_STORE = 'data/earthquakes_24mo.geojson';
var quakeWindowDays = 7;                // display window; set by the toolbar selector
const QUAKE_REFRESH_MS = 15 * 60 * 1000; // re-read the local store every 15 min
const SHOW_QUAKES_DEFAULT = true;       // earthquakes layer on by default

// ── State ─────────────────────────────────────────────────────
let stations = [],
    map = null,
    verifiedStatus = {},   // from data/ausis_status.json (hourly ausis-status.yml)
    statusChecked = null,  // its "checked" timestamp — drives the staleness badge
    stationsFetched = null,// data/ausis_stations.geojson "fetched" timestamp (daily ausis-backup.yml)
    waveformManifest = {}, // from waveforms branch: { generated, stations:{CODE:{...}} }
    eventSections = {},    // from event-waveforms branch: { event_id: {...} }
    quakeLayer = null,
    quakeLinkLayer = null, // dashed connectors from an open quake to nearby stations
    quakeData = [],
    quakesVisible = SHOW_QUAKES_DEFAULT;

// ── Helpers ──────────────────────────────────────────────────
// Escapes quotes as well as &<> because esc() output lands inside
// double-quoted attributes and single-quoted inline-JS strings.
function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Great-circle distance in km
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, toRad = Math.PI / 180;
  const dLat = (lat2 - lat1) * toRad, dLon = (lon2 - lon1) * toRad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLon / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(a)));
}

// ── Marker icon ──────────────────────────────────────────────
function triangleSVG(size, strokeColor) {
  const h = size / 2;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">'
    + '<polygon points="' + h + ',2 ' + (size - 2) + ',' + (size - 2) + ' 2,' + (size - 2) + '" fill="#000" stroke="' + strokeColor + '" stroke-width="2" stroke-linejoin="round"/></svg>';
}
function triangleIcon(size, strokeColor) {
  const h = size / 2;
  const stroke = strokeColor || '#fff';
  return L.divIcon({ html: triangleSVG(size, stroke), className: '', iconSize: [size, size], iconAnchor: [h, size - 2], popupAnchor: [0, -(size - 4)] });
}
// Single source of truth for station status — every marker colour, z-order,
// popup row, count and waveform gate derives from this one ladder.
// Returns 'live' | 'intermittent' | 'ended' | 'unknown'.
function stationStatus(s) {
  if (s.endTime) return 'ended';
  // A station in a fresh waveform manifest streamed within the last render
  // window — the strongest live signal we have.
  if (wfHasPlot(s.code)) return 'live';
  // Hourly server-side status check (dataselect probe) overrides a lagging
  // availability index — but only while the check itself is fresh.
  if (verifiedStatus[s.code] && verifiedStatus[s.code].streaming) return 'live';
  if (s.latestData) {
    var daysAgo = (Date.now() - s.latestData.getTime()) / 86400000;
    return daysAgo <= LIVE_THRESHOLD_DAYS ? 'live' : 'intermittent';
  }
  return 'unknown';
}

// True when the hourly waveform manifest is fresh and lists this station.
function wfHasPlot(code) {
  if (!waveformManifest || !waveformManifest.stations || !waveformManifest.stations[code]) return false;
  var gen = waveformManifest.generated ? Date.parse(waveformManifest.generated) : NaN;
  return !isNaN(gen) && (Date.now() - gen) <= WAVEFORM_FRESH_HOURS * 3600000;
}

function stationStrokeColor(s) {
  var st = stationStatus(s);
  if (st === 'ended') return '#ef4444';
  if (st === 'intermittent') return '#facc15';
  return '#22c55e';   // live, or unknown (active, no data report yet)
}

// ── Legend icons ─────────────────────────────────────────────
function setLegendIcons() {
  document.getElementById('legend-streaming').innerHTML = triangleSVG(16, '#22c55e');
  document.getElementById('legend-offline').innerHTML = triangleSVG(16, '#facc15');
  document.getElementById('legend-ended').innerHTML = triangleSVG(16, '#ef4444');
}

// ── Map initialisation ───────────────────────────────────────
function initMap() {
  map = L.map('map', { center: [-26, 134], zoom: 5, maxZoom: 18, minZoom: 3, zoomControl: false });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 18, opacity: 0.8 }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, opacity: 0.6 }).addTo(map);

  // Earthquake layer group (added/removed by the toolbar toggle)
  quakeLayer = L.layerGroup();
  quakeLinkLayer = L.layerGroup().addTo(map); // connectors to nearby stations
  if (quakesVisible) quakeLayer.addTo(map);

  // Tools button — three dots toggle
  const ToolbarControl = L.Control.extend({
    onAdd: function() {
      const wrap = L.DomUtil.create('div', 'toolbar-wrap');
      L.DomEvent.disableClickPropagation(wrap);
      L.DomEvent.disableScrollPropagation(wrap);
      const toggle = L.DomUtil.create('a', 'tools-toggle', wrap);
      toggle.href = '#'; toggle.title = 'Map tools';
      toggle.innerHTML = '&#x22EE;';
      const buttons = L.DomUtil.create('div', 'toolbar-buttons', wrap);

      const zoomGroup = L.DomUtil.create('div', 'btn-group', buttons);
      const zoomIn = L.DomUtil.create('a', '', zoomGroup);
      zoomIn.href = '#'; zoomIn.title = 'Zoom in'; zoomIn.innerHTML = '+'; zoomIn.style.fontSize = '18px';
      zoomIn.onclick = function(e) { e.preventDefault(); map.zoomIn(); };
      const zoomOut = L.DomUtil.create('a', '', zoomGroup);
      zoomOut.href = '#'; zoomOut.title = 'Zoom out'; zoomOut.innerHTML = '&minus;'; zoomOut.style.fontSize = '18px';
      zoomOut.onclick = function(e) { e.preventDefault(); map.zoomOut(); };

      const homeGroup = L.DomUtil.create('div', 'btn-group', buttons);
      const home = L.DomUtil.create('a', '', homeGroup);
      home.href = '#'; home.title = 'Zoom to all stations';
      home.innerHTML = '&#x1F3E0;'; home.style.fontSize = '16px';
      home.onclick = function(e) { e.preventDefault(); map.setView([-28, 134], 4); };

      // Earthquake layer toggle
      const quakeGroup = L.DomUtil.create('div', 'btn-group', buttons);
      const quakeBtn = L.DomUtil.create('a', quakesVisible ? 'active' : '', quakeGroup);
      quakeBtn.href = '#'; quakeBtn.title = 'Show/hide recent earthquakes';
      quakeBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" style="vertical-align:middle">'
        + '<path d="M1 8 L4 8 L6 3 L8 13 L10 5 L12 8 L15 8" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';

      // Time-window selector — a small flyout shown while earthquakes are on
      const quakeWin = L.DomUtil.create('div', 'quake-win-panel', buttons);
      quakeWin.innerHTML = '<label for="quake-window">Earthquakes — show</label>'
        + '<select id="quake-window" aria-label="Earthquake time window">'
        + '<option value="1">Last 24 hours</option>'
        + '<option value="7" selected>Last 7 days</option>'
        + '<option value="30">Last 30 days</option>'
        + '<option value="730">Last 24 months</option>'
        + '</select>';
      quakeWin.classList.toggle('open', quakesVisible);

      quakeBtn.onclick = function(e) {
        e.preventDefault();
        setQuakesVisible(!quakesVisible);
        quakeBtn.classList.toggle('active', quakesVisible);
        quakeWin.classList.toggle('open', quakesVisible);
      };

      const searchGroup = L.DomUtil.create('div', 'btn-group', buttons);
      const searchBtn = L.DomUtil.create('a', '', searchGroup);
      searchBtn.href = '#'; searchBtn.title = 'Search stations';
      searchBtn.innerHTML = '&#x1F50D;'; searchBtn.style.fontSize = '15px';

      const panel = L.DomUtil.create('div', 'search-panel', wrap);
      const input = L.DomUtil.create('input', '', panel);
      input.type = 'text'; input.placeholder = 'Search stations...';
      const res = L.DomUtil.create('div', 'search-results', panel);

      toggle.onclick = function(e) {
        e.preventDefault();
        const isOpen = buttons.classList.contains('open');
        buttons.classList.toggle('open');
        if (isOpen) { panel.classList.remove('open'); }
      };
      searchBtn.onclick = function(e) {
        e.preventDefault();
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) { input.value = ''; res.innerHTML = ''; input.focus(); }
      };
      input.oninput = function() {
        const q = input.value.trim().toLowerCase(); res.innerHTML = '';
        if (q.length < 2) return;
        stations.filter(function(s) { return s.code.toLowerCase().indexOf(q) !== -1 || s.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 10).forEach(function(s) {
          const row = document.createElement('div');
          row.innerHTML = '<b style="color:#2563eb;font-family:monospace">' + esc(s.code) + '</b> ' + esc(s.name);
          row.onclick = function() { input.value = ''; res.innerHTML = ''; panel.classList.remove('open'); map.setView([s.lat, s.lng], 12, { animate: true }); setTimeout(function() { s.marker.openPopup(); }, 300); };
          res.appendChild(row);
        });
      };
      return wrap;
    }
  });
  new ToolbarControl({ position: 'topleft' }).addTo(map);

  map.on('zoomend', function() {
    const size = Math.max(16, Math.min(32, map.getZoom() * 2.9));
    stations.forEach(function(s) {
      if (s.marker) s.marker.setIcon(triangleIcon(size, stationStrokeColor(s)));
    });
  });

  // Popup open: quakes draw dashed links to nearby stations.
  // Station waveforms need no JS here — the <img> is embedded in the popup
  // HTML with its src preset, so the browser loads it in place.
  map.on('popupopen', function(e) {
    var src = e.popup && e.popup._source;
    if (src && src._quake) drawQuakeLinks(src._quake.lat, src._quake.lng);
  });
  map.on('popupclose', function(e) {
    var src = e.popup && e.popup._source;
    if (src && src._quake) clearQuakeLinks();
  });
}

// ── Formatting ───────────────────────────────────────────────
function formatDate(d) {
  if (!d) return 'Unknown';
  const p = d.substring(0, 10).split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return p.length === 3 ? p[2] + ' ' + months[parseInt(p[1], 10) - 1] + ' ' + p[0] : esc(d);
}
function formatDateTime(d) {
  // d is a Date — show UTC and local browser time, compactly
  var utc = d.toISOString().replace('T', ' ').replace(/:\d\d\.\d+Z$/, ' UTC');
  var loc = d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  return utc + ' &middot; ' + loc + ' local';
}

// ── Data fetching (same-origin files committed by GitHub Actions) ────
async function fetchStationsFromBackup() {
  try {
    var resp = await fetch('data/ausis_stations.geojson?v=' + hourStamp());
    if (!resp.ok) return [];
    var geojson = await resp.json();
    if (geojson.metadata && geojson.metadata.fetched) stationsFetched = geojson.metadata.fetched;
    return (geojson.features || []).map(function(f) {
      var coords = f.geometry.coordinates;
      var p = f.properties;
      return { code: p.code, lat: coords[1], lng: coords[0], elevation: p.elevation || 0, name: p.name || p.code, startTime: p.startTime || '', endTime: p.endTime || null, latestData: p.latestData ? new Date(p.latestData) : null, marker: null };
    });
  } catch (e) {
    console.warn('Local backup also failed:', e);
    return [];
  }
}

// Fetch the waveform manifest from the `waveforms` branch. Tells us which
// stations have a fresh plot and when it was generated — a fresh entry is
// also the strongest "live" signal, so markers refresh after each load.
async function fetchWaveformManifest() {
  try {
    var resp = await fetch(WAVEFORM_BASE + 'manifest.json?v=' + hourStamp());
    if (!resp.ok) return;
    waveformManifest = await resp.json();
    if (stations.length) { refreshMarkers(); updateHeader(); }
  } catch (e) {
    // Branch may not exist yet (first Action run pending) — that's fine.
  }
}

// Event record-section manifest: { events: [ {event_id, stations:[...], ...} ] }
// Indexed by event_id so a quake popup can show its section if one exists.
async function fetchEventSections() {
  try {
    var resp = await fetch(EVENT_WF_BASE + 'manifest.json?v=' + hourStamp());
    if (!resp.ok) return;
    var m = await resp.json();
    var byId = {};
    (m.events || []).forEach(function(e) { byId[e.event_id] = e; });
    eventSections = byId;
    updateSpotlight();
  } catch (e) {
    // event-waveforms branch may not exist yet — fine, popups just omit it.
  }
}

// Cache-buster that changes once per UTC hour (matches the hourly job)
function hourStamp() {
  return new Date().toISOString().slice(0, 13).replace(/[-T]/g, '');
}

// ── Latest-earthquake spotlight ──────────────────────────────
// Chip pointing at the newest event (≤7 days) that has a record section —
// the sections are the best thing the pipeline makes; don't bury them.
var spotlightDismissed = false;

function timeAgo(ms) {
  var h = (Date.now() - ms) / 3600000;
  if (h < 1) return Math.max(1, Math.round(h * 60)) + ' min ago';
  if (h < 48) return Math.round(h) + ' h ago';
  return Math.round(h / 24) + ' days ago';
}

function updateSpotlight() {
  var el = document.getElementById('spotlight');
  if (!el || spotlightDismissed) return;
  var best = null;
  Object.keys(eventSections).forEach(function(id) {
    var e = eventSections[id];
    var t = e.origin ? Date.parse(e.origin) : NaN;
    if (isNaN(t) || Date.now() - t > 7 * 86400000) return;
    if (!best || t > best.t) best = { id: id, t: t, e: e };
  });
  if (!best) { el.classList.remove('on'); return; }
  var e = best.e;
  el.querySelector('.sp-mag').textContent = 'M' + (e.mag != null ? Number(e.mag).toFixed(1) : '?');
  el.querySelector('.sp-text').textContent =
    ' ' + (e.place || 'earthquake') + ' · ' + timeAgo(best.t) + ' — see the waves →';
  el._qid = best.id;
  el.classList.add('on');
}

(function() {
  var el = document.getElementById('spotlight');
  if (!el) return;
  function activate() { if (el._qid) revealQuake(el._qid); }
  el.addEventListener('click', function(ev) {
    if (ev.target.classList.contains('sp-close')) {
      spotlightDismissed = true;
      el.classList.remove('on');
      ev.stopPropagation();
      return;
    }
    activate();
  });
  el.addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); activate(); }
  });
})();

// ── Deep links: #station=CODE / #quake=ID open the matching popup ──
var deepLinkDone = { station: false, quake: false };

function applyDeepLink() {
  var m = /^#(station|quake)=([A-Za-z0-9_-]+)$/.exec(window.location.hash || '');
  if (!m) return;
  if (m[1] === 'station' && !deepLinkDone.station && stations.length) {
    var code = m[2].toUpperCase();
    var s = stations.filter(function(x) { return x.code === code; })[0];
    if (s && s.marker) {
      deepLinkDone.station = true;
      map.setView([s.lat, s.lng], 8);
      setTimeout(function() { s.marker.openPopup(); }, 300);
    }
  } else if (m[1] === 'quake' && !deepLinkDone.quake && quakeStoreFeatures.length) {
    deepLinkDone.quake = revealQuake(m[2]);
  }
}

// ── Quake → station connector lines ──────────────────────────
function clearQuakeLinks() {
  if (quakeLinkLayer) quakeLinkLayer.clearLayers();
}

// Draw faint dashed lines from a quake to its nearest AuSIS stations, each
// with a midpoint label: distance and rough seismic travel time (~3.5 km/s
// S/surface-wave speed) — distance ÷ time = wave speed, done by the reader.
function drawQuakeLinks(lat, lng) {
  if (!quakeLinkLayer) return;
  quakeLinkLayer.clearLayers();
  nearestStations(lat, lng, WAVEFORM_NEAR_LINKS).forEach(function(x) {
    var s = x.station;
    var line = L.polyline([[lat, lng], [s.lat, s.lng]], {
      color: '#b91c1c', weight: 1.5, opacity: 0.8, dashArray: '4 6', interactive: false
    });
    quakeLinkLayer.addLayer(line);
    var secs = Math.round(x.dist / 3.5 / 5) * 5;   // ~S-wave speed, rounded to 5 s
    if (secs > 0) {
      var label = L.marker([(lat + s.lat) / 2, (lng + s.lng) / 2], {
        interactive: false,
        icon: L.divIcon({
          className: 'q-conn-label',
          html: '~' + x.dist + ' km &middot; waves &asymp; ' + (secs >= 120 ? Math.round(secs / 60) + ' min' : secs + ' s'),
          iconSize: null
        })
      });
      quakeLinkLayer.addLayer(label);
    }
  });
}

// ── Marker rendering ─────────────────────────────────────────
function stationZIndex(s) {
  var st = stationStatus(s);
  if (st === 'ended') return 0;
  if (st === 'intermittent') return 1000;
  return 2000;
}

function buildPopupHtml(s) {
  var status = stationStatus(s);
  // Show the waveform block whenever a fresh plot exists — never hide healthy
  // pipeline output behind a possibly-stale status heuristic. Fall back to
  // the status when the manifest itself failed to load.
  var showWf = wfHasPlot(s.code) || status === 'live';
  return '<div class="popup-title">' + esc(s.name) + '</div>'
    + '<div class="popup-row"><span class="popup-code">S1.' + esc(s.code) + '</span> <strong>Recording since:</strong> ' + formatDate(s.startTime) + '</div>'
    + (function() {
        if (status === 'ended') return '<div class="popup-row"><strong>End:</strong> ' + formatDate(s.endTime) + '</div>';
        if (status === 'live') return '<div class="popup-row" style="color:#16a34a"><strong>Data:</strong> Streaming</div>';
        if (status === 'unknown') return '<div class="popup-row" style="color:#16a34a"><strong>Status:</strong> Active</div>';
        var daysAgo = Math.floor((Date.now() - s.latestData.getTime()) / 86400000);
        return '<div class="popup-row" style="color:#d97706"><strong>Last data:</strong> ' + formatDate(s.latestData.toISOString()) + ' (' + daysAgo + ' days ago)</div>';
      })()
    + '<div class="popup-row"><strong>Coordinates:</strong> ' + s.lat.toFixed(3) + ', ' + s.lng.toFixed(3) + '</div>'
    + (showWf
        ? (function() {
            var src  = (waveformManifest.source) ? esc(waveformManifest.source) : 'EarthScope';
            var upd  = waveformManifest.generated
              ? ' · updated ' + esc(waveformManifest.generated.slice(0, 13).replace('T', ' ') + ':00 UTC')
              : ' (updated hourly)';
            var base = WAVEFORM_BASE + encodeURIComponent(s.code) + '_';
            var stamp = hourStamp();
            function seg(v, label) {
              return '<button type="button" class="wf-seg-btn' + (v === 'raw' ? ' active' : '')
                + '" onclick="wfSwitch(this,\'' + esc(s.code) + '\',\'' + v + '\')">' + label + '</button>';
            }
            return '<div class="wf">'
              + '<div class="wf-head"><span class="wf-label">Waveform last hour</span></div>'
              + '<div class="wf-seg" data-code="' + esc(s.code) + '" data-base="' + base + '" data-stamp="' + stamp + '">'
              + seg('raw', 'Raw') + seg('local', 'Local') + seg('distant', 'Distant') + seg('spectrogram', 'Spectro')
              + '</div>'
              + '<div class="wf-frame" data-code="' + esc(s.code) + '">'
              + '<div class="wf-status">Loading last hour…</div>'
              + '<img class="wf-img" alt="Last hour of ground velocity at ' + esc(s.code) + '" '
              + 'src="' + base + 'raw.png?v=' + stamp + '" '
              + 'onload="this.parentNode.classList.add(\'loaded\')" '
              + 'onerror="this.parentNode.classList.add(\'failed\')">'
              + '</div>'
              + '<div class="wf-foot" data-code="' + esc(s.code) + '">'
              + 'source: ' + src + upd + '</div>'
              + '</div>';
          })()
        : '');
}

// Switch the waveform image between raw / local / distant filter variants.
// Called inline from the segmented buttons in the station popup.
function wfSwitch(btn, code, variant) {
  var seg = btn.parentNode;
  var wf = seg.parentNode;
  var frame = wf.querySelector('.wf-frame');
  var img = frame && frame.querySelector('.wf-img');
  if (!img) return;
  var btns = seg.querySelectorAll('.wf-seg-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  frame.classList.remove('loaded', 'failed');
  img.src = seg.getAttribute('data-base') + variant + '.png?v=' + seg.getAttribute('data-stamp');
}

function addMarkers() {
  var size = Math.max(16, Math.min(32, map.getZoom() * 2.9));
  var sorted = stations.slice().sort(function(a, b) { return stationZIndex(a) - stationZIndex(b); });
  sorted.forEach(function(s) {
    var icon = triangleIcon(size, stationStrokeColor(s));
    // Bind a FUNCTION so the popup re-renders on every open — status, image
    // URL and hourStamp cache-buster stay current on long-lived embeds.
    var m = L.marker([s.lat, s.lng], { icon: icon, zIndexOffset: stationZIndex(s) }).bindPopup(function() { return buildPopupHtml(s); }, { maxWidth: 700, minWidth: 240 }).addTo(map);
    m._station = s;
    s.marker = m;
  });
}

// Update existing markers in place — no remove/add, no flash
function refreshMarkers() {
  var size = Math.max(16, Math.min(32, map.getZoom() * 2.9));
  stations.forEach(function(s) {
    if (s.marker) {
      s.marker.setIcon(triangleIcon(size, stationStrokeColor(s)));
      s.marker.setZIndexOffset(stationZIndex(s));
      // Popup content is a bound function — it re-renders on next open.
    }
  });
}

function isStationStreaming(s) {
  return stationStatus(s) === 'live';
}

function updateHeader() {
  var active = stations.filter(function(s) { return !s.endTime; }).length;
  var streaming = stations.filter(isStationStreaming).length;
  document.getElementById('header-title').textContent = 'AuSIS Map - ' + active + ' school seismometers';
  document.getElementById('legend-streaming-text').textContent = 'Live streaming (' + streaming + ')';
}

// ── Earthquakes (Geoscience Australia rolling store, same-origin) ──
// Seismic-map convention (GA / USGS): colour = recency (red = newest),
// size = magnitude. Magnitude is not double-encoded in colour.
function quakeColor(ageDays) {
  if (ageDays < 1) return '#dc2626';   // last 24 hours — red
  if (ageDays < 7) return '#f97316';   // last 7 days — orange
  return '#facc15';                    // older — yellow
}
function quakeRadius(m) {
  return 0.8 * Math.max(4, Math.min(22, 3 + m * 2.6));
}

var quakeStoreFeatures = [];   // full store as fetched (filtered to window for display)

function applyQuakeWindow() {
  var cutoff = Date.now() - quakeWindowDays * 86400000;
  quakeData = quakeStoreFeatures.filter(function(f) {
    if (!f.geometry || !f.geometry.coordinates || !f.properties) return false;
    if (f.properties.mag == null) return false;
    var t = Date.parse(f.properties.time);
    return !isNaN(t) && t >= cutoff;
  });
  renderQuakes();
  updateQuakeLegend();
}

async function fetchQuakes() {
  try {
    var resp = await fetch(QUAKE_STORE + '?v=' + hourStamp());
    if (!resp.ok) throw new Error('quake store HTTP ' + resp.status);
    var gj = await resp.json();
    quakeStoreFeatures = gj.features || [];
    applyQuakeWindow();
    applyDeepLink();
  } catch (e) {
    console.warn('Earthquake store load failed:', e);
    updateQuakeLegend();
  }
}

function nearestStations(lat, lng, n) {
  return stations
    .filter(function(s) { return !s.endTime; })
    .map(function(s) { return { station: s, code: s.code, name: s.name, dist: haversineKm(lat, lng, s.lat, s.lng) }; })
    .sort(function(a, b) { return a.dist - b.dist; })
    .slice(0, n);
}

function buildQuakePopup(f) {
  var c = f.geometry.coordinates; // [lon, lat]
  var p = f.properties;
  var when = new Date(p.time);
  var magStr = (p.mag != null ? p.mag.toFixed(1) : '?')
    + (p.magType ? ' ' + esc(p.magType) : '');
  var section = (p.id && eventSections[p.id]) ? eventSections[p.id] : null;
  var sectionHtml = section
    ? '<div class="q-section">'
      + '<div class="q-section-label">Recorded by AuSIS</div>'
      + '<img class="q-section-img" loading="lazy" '
      + 'alt="Record section for ' + esc(p.id) + '" '
      + 'src="' + EVENT_WF_BASE + encodeURIComponent(p.id) + '.png?v=' + hourStamp() + '">'
      + '</div>'
    : '';
  // The nearest-stations list is only shown when there is NO record section
  // (the section already names the stations, better). Without a section it is
  // the only AuSIS context, so it stays for remote / small / capped quakes.
  var near = section ? [] : nearestStations(c[1], c[0], WAVEFORM_NEAR_LIST);
  var nearHtml = section ? ''
    : (near.length
        ? '<div class="q-near"><b>Nearest AuSIS stations</b><br>' + near.map(function(x) {
            return esc(x.name) + ' (S1.' + esc(x.code) + ') ~' + x.dist + ' km';
          }).join('<br>') + '</div>'
        : '<div class="q-near" style="color:#94a3b8">Locating nearest AuSIS stations…</div>');
  return '<div class="q-title">M ' + magStr + '</div>'
    + '<div class="q-place">' + esc(p.place || 'Unknown location') + '</div>'
    + '<div class="q-row"><strong>Time:</strong> ' + formatDateTime(when) + '</div>'
    + '<div class="q-row"><strong>Depth:</strong> ' + (p.depth != null ? Math.round(p.depth) + ' km' : 'n/a') + '</div>'
    + '<div class="q-row"><strong>Coordinates:</strong> ' + c[1].toFixed(3) + ', ' + c[0].toFixed(3) + '</div>'
    + sectionHtml
    + nearHtml;
}

function renderQuakes() {
  if (!quakeLayer) return;
  quakeLayer.clearLayers();
  quakeData.forEach(function(f) {
    var c = f.geometry.coordinates;
    var m = f.properties.mag;
    var ageDays = (Date.now() - Date.parse(f.properties.time)) / 86400000;
    var marker = L.circleMarker([c[1], c[0]], {
      radius: quakeRadius(m),
      color: '#fff',
      weight: 1,
      fillColor: quakeColor(ageDays),
      fillOpacity: 0.85
    }).bindPopup(function() { return buildQuakePopup(f); }, { maxWidth: 700, minWidth: 240 });
    marker._quake = { lat: c[1], lng: c[0] };
    marker._qid = f.properties.id;
    quakeLayer.addLayer(marker);
  });
}

// Find a quake marker by event id, widening the time window if needed.
function revealQuake(id) {
  var found = null;
  function search() {
    found = null;
    quakeLayer.eachLayer(function(l) { if (l._qid === id) found = l; });
  }
  search();
  if (!found) {                      // maybe outside the current time window
    quakeWindowDays = 730;
    var sel = document.getElementById('quake-window');
    if (sel) sel.value = '730';
    applyQuakeWindow();
    search();
  }
  if (!found) return false;
  setQuakesVisible(true);
  map.setView(found.getLatLng(), Math.max(map.getZoom(), 5));
  setTimeout(function() { found.openPopup(); }, 250);
  return true;
}

function setQuakesVisible(v) {
  quakesVisible = v;
  if (v) { quakeLayer.addTo(map); } else { map.removeLayer(quakeLayer); }
  updateQuakeLegend();
}

function updateQuakeLegend() {
  var el = document.getElementById('legend-quakes');
  var txt = document.getElementById('legend-quakes-text');
  el.classList.toggle('off', !quakesVisible);
  txt.textContent = 'Earthquakes';
}

// Load the hourly server-side status check (data/ausis_status.json, written
// by .github/workflows/ausis-status.yml). Streaming overrides are only
// trusted while the check itself is fresh — a frozen file must never pin a
// station green (or hide that the pipeline died).
async function loadVerifiedStatus() {
  try {
    var resp = await fetch('data/ausis_status.json?v=' + hourStamp());
    if (!resp.ok) return;
    var data = await resp.json();
    statusChecked = data.checked || null;
    var age = statusChecked ? Date.now() - Date.parse(statusChecked) : NaN;
    if (!isNaN(age) && age <= STATUS_STALE_HOURS * 3600000) {
      verifiedStatus = data.stations || {};
    } else {
      // Clear overrides loaded earlier: on a long-lived embed the file can
      // transition fresh -> stale between interval refreshes, and old
      // streaming:true entries must not keep pinning stations green.
      verifiedStatus = {};
    }
  } catch (e) {
    // No status file yet - that's fine
  }
}

// Amber footer badge when the committed status data has stopped updating —
// a silently-frozen pipeline must be visible on the page, not just in logs.
function updateStalenessBadge() {
  var el = document.getElementById('stale-badge');
  if (!el) return;
  var newest = null;
  [statusChecked, stationsFetched].forEach(function(t) {
    var ms = t ? Date.parse(t) : NaN;
    if (!isNaN(ms) && (newest === null || ms > newest)) newest = ms;
  });
  if (newest === null || Date.now() - newest > STATUS_STALE_HOURS * 3600000) {
    el.textContent = '⚠ Station status last updated ' +
      (newest ? formatDate(new Date(newest).toISOString()) : 'unknown');
    el.style.display = '';
  } else {
    el.style.display = 'none';
  }
}

// ── Initialise ───────────────────────────────────────────────
setLegendIcons();
initMap();
updateQuakeLegend();

// Earthquake layer toggle from the footer legend item
document.getElementById('legend-quakes').onclick = function() {
  setQuakesVisible(!quakesVisible);
  var btn = document.querySelector('.btn-group a.active, .toolbar-buttons .btn-group a[title="Show/hide recent earthquakes"]');
  if (btn) btn.classList.toggle('active', quakesVisible);
  var panel = document.querySelector('.quake-win-panel');
  if (panel) panel.classList.toggle('open', quakesVisible);
};

// Earthquake time-window selector (client-side filter over the loaded store)
(function() {
  var sel = document.getElementById('quake-window');
  if (!sel) return;
  sel.value = String(quakeWindowDays);
  sel.addEventListener('change', function() {
    quakeWindowDays = parseInt(sel.value, 10) || 7;
    applyQuakeWindow();
  });
})();

// Fetch waveform manifest + earthquakes in the background (independent of stations)
fetchWaveformManifest();
fetchEventSections();
setInterval(fetchWaveformManifest, 15 * 60 * 1000); // refresh manifest/status every 15 min
setInterval(fetchEventSections, 15 * 60 * 1000);
setInterval(function() {                            // long-lived embeds stay honest
  loadVerifiedStatus().then(function() {
    if (stations.length) { refreshMarkers(); updateHeader(); }
    updateStalenessBadge();
  });
}, 15 * 60 * 1000);
fetchQuakes();
setInterval(fetchQuakes, QUAKE_REFRESH_MS);

// Station data comes entirely from same-origin files committed by the
// scheduled Actions (ausis-status.yml hourly, ausis-backup.yml daily). The
// browser never calls a third-party API — upstream migrations, redirects and
// CORS changes are absorbed server-side where they can't break the page.
loadVerifiedStatus().then(function() {
  return fetchStationsFromBackup();
}).then(function(data) {
  if (data.length > 0) {
    stations = data;
    addMarkers();
    map.setView([-28, 134], 4);
    applyDeepLink();
  } else {
    console.warn('Station data failed to load (data/ausis_stations.geojson).');
  }
  updateHeader();
  updateStalenessBadge();
}).catch(function(err) {
  console.warn('Station load failed:', err);
  updateStalenessBadge();
});

// Fullscreen button: use the Fullscreen API where the parent iframe permits
// it (allow="fullscreen"); otherwise open the map standalone in a new tab so
// the button is never dead even inside a cross-origin iframe.
(function() {
  var btn = document.getElementById('fs-btn');
  if (!btn) return;
  var target = document.documentElement;

  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function canFullscreen() {
    return !!(target.requestFullscreen || target.webkitRequestFullscreen)
      && (document.fullscreenEnabled !== false);
  }
  function openStandalone() {
    // The map served directly (no iframe) renders full-window already.
    window.open(window.location.href, '_blank', 'noopener');
  }

  btn.addEventListener('click', function() {
    if (fsElement()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    if (!canFullscreen()) { openStandalone(); return; }
    var req = target.requestFullscreen || target.webkitRequestFullscreen;
    var p;
    try { p = req.call(target); } catch (e) { openStandalone(); return; }
    if (p && p.catch) { p.catch(function() { openStandalone(); }); }
  });

  document.addEventListener('fullscreenchange', function() {
    btn.title = fsElement() ? 'Exit fullscreen' : 'Fullscreen';
    if (window.map && map.invalidateSize) setTimeout(function() { map.invalidateSize(); }, 100);
  });
})();

// Size tier: when the map is wide (true fullscreen, the new-tab fallback, OR
// just a large desktop embed) add an `enlarged` class so CSS can show the
// waveform images at ~2x. Size-based, not fullscreen-based, so it works on
// the live iframe site where the Fullscreen API is blocked. Hysteresis (two
// thresholds) stops flicker when the width sits near the boundary.
(function() {
  var el = document.getElementById('map');
  if (!el) return;
  // Three tiers with hysteresis bands so width near a boundary doesn't flicker:
  //   compact  : < ~720         (the ~644 embed lives here)
  //   medium   : ~770 – ~1100   (small laptop / partial window)
  //   large    : > ~1150        (fullscreen / new-tab / big desktop)
  var MED_UP = 770, MED_DN = 720, LG_UP = 1150, LG_DN = 1080;
  var tier = 'compact';

  function pick(w) {
    if (tier === 'compact') {
      if (w >= LG_UP) return 'large';
      if (w >= MED_UP) return 'medium';
    } else if (tier === 'medium') {
      if (w >= LG_UP) return 'large';
      if (w < MED_DN) return 'compact';
    } else { // large
      if (w < MED_DN) return 'compact';
      if (w < LG_DN) return 'medium';
    }
    return tier;
  }

  function apply() {
    var w = el.clientWidth || 0;
    var next = pick(w);
    if (next === tier) return;            // no tier change
    tier = next;
    el.classList.toggle('medium',   tier === 'medium');
    el.classList.toggle('enlarged', tier === 'large');
    // Re-open the active popup so Leaflet recomputes its width at the new tier
    if (window.map && map._popup && map._popup.isOpen()) {
      var p = map._popup;
      if (p._source && p._source.openPopup) {
        map.closePopup(p);
        setTimeout(function() { p._source.openPopup(); }, 60);
      }
    }
  }

  if (window.ResizeObserver) {
    new ResizeObserver(apply).observe(el);
  } else {
    window.addEventListener('resize', apply);
  }
  document.addEventListener('fullscreenchange', function() {
    setTimeout(apply, 150);
  });
  apply();
})();

</script>
</body>
</html>
