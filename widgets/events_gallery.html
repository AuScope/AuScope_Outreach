<!DOCTYPE html>
<!--
  widgets/events_gallery.html?mode=local|tele|all
  Auto-generated version of the AuSIS site's hand-written "Earthquake Events"
  pages: a newest-first feed of recorded events with their record sections
  and per-event actions (map, printable worksheet, GA event page). Embed
  ?mode=local on the Local page and ?mode=tele on the International page —
  they then update themselves within hours of every qualifying earthquake.

    <iframe src=".../widgets/events_gallery.html?mode=local"
            width="100%" height="1200" frameborder="0"
            style="border:none;" scrolling="yes"></iframe>
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earthquakes recorded by AuSIS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, Helvetica, sans-serif; background: transparent; color: #374151; }
.wrap { max-width: 760px; margin: 0 auto; }
.feedhead { display: flex; align-items: center; gap: 10px; padding: 4px 2px 10px; }
.feedhead img { height: 36px; }
.feedhead .t { font-size: 15px; font-weight: 700; color: #282572; }
.feedhead .s { font-size: 11px; color: #94a3b8; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.q-line { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px 6px; }
.q-line .mag { font-weight: 700; color: #b91c1c; font-size: 17px; white-space: nowrap; }
.q-line .place { font-size: 15px; font-weight: 700; color: #282572; flex: 1; }
.q-line .ago { font-size: 11px; color: #94a3b8; white-space: nowrap; }
.facts { padding: 0 14px 8px; font-size: 11.5px; color: #6b7280; }
.section-img { display: block; width: 100%; height: auto; border-top: 1px solid #e2e8f0; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; padding: 9px 14px; font-size: 12px; }
.actions a { color: #2563eb; text-decoration: none; font-weight: 700; }
.actions a:hover { text-decoration: underline; }
.empty { padding: 28px 14px; text-align: center; font-size: 13px; color: #6b7280; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; }
.foot { text-align: center; font-size: 10.5px; color: #94a3b8; padding: 4px 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="feedhead">
    <img src="../assets/ausis-logo.png" alt="AuSIS">
    <div>
      <div class="t" id="title">Earthquakes recorded by AuSIS</div>
      <div class="s" id="sub">Updated automatically within hours of each event</div>
    </div>
  </div>
  <div id="feed"><div class="empty">Loading&hellip;</div></div>
  <div class="foot">Sections show predicted P, S and main-shaking arrivals · data via EarthScope &amp; Geoscience Australia</div>
</div>
<script>
const RAW = 'https://raw.githubusercontent.com/AuScope/AuScope_Outreach/event-waveforms/';
const BASE = 'https://auscope.github.io/AuScope_Outreach/';
const params = new URLSearchParams(window.location.search);
const MODE = ['local', 'tele', 'all'].includes(params.get('mode')) ? params.get('mode') : 'all';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function hourStamp() { return new Date().toISOString().slice(0, 13).replace(/[-T]/g, ''); }
function timeAgo(ms) {
  var h = (Date.now() - ms) / 3600000;
  if (h < 1) return Math.max(1, Math.round(h * 60)) + ' min ago';
  if (h < 48) return Math.round(h) + ' hours ago';
  return Math.round(h / 24) + ' days ago';
}

document.getElementById('title').textContent =
  MODE === 'local' ? 'Local earthquakes recorded by AuSIS'
  : MODE === 'tele' ? 'International earthquakes recorded by AuSIS'
  : 'Earthquakes recorded by AuSIS';

fetch(RAW + 'manifest.json?v=' + hourStamp())
  .then(function(r) { if (!r.ok) throw 0; return r.json(); })
  .then(function(m) {
    var evs = (m.events || [])
      .filter(function(e) { return MODE === 'all' || (MODE === 'tele' ? e.mode === 'tele' : e.mode !== 'tele'); })
      .sort(function(a, b) { return Date.parse(b.origin) - Date.parse(a.origin); });
    if (!evs.length) {
      document.getElementById('feed').innerHTML =
        '<div class="empty">No ' + (MODE === 'tele' ? 'international' : 'local')
        + ' earthquakes with clean recordings in the last 30 days — check back after the next one.</div>';
      return;
    }
    document.getElementById('feed').innerHTML = evs.map(function(e) {
      var t = Date.parse(e.origin);
      var n = (e.stations || []).length;
      var nearest = (e.stations || []).slice().sort(function(a, b) { return a.dist_km - b.dist_km; })[0];
      var ga = /^ga/.test(e.event_id)
        ? '<a href="https://earthquakes.ga.gov.au/event/' + encodeURIComponent(e.event_id) + '" target="_blank" rel="noopener">Geoscience Australia &rarr;</a>'
        : '';
      return '<div class="card">'
        + '<div class="q-line"><span class="mag">M ' + Number(e.mag).toFixed(1) + '</span>'
        + '<span class="place">' + esc(e.place || 'Unknown location') + '</span>'
        + '<span class="ago">' + timeAgo(t) + '</span></div>'
        + '<div class="facts">' + esc(String(e.origin).replace('T', ' ').replace('Z', ' UTC'))
        + ' · recorded by ' + n + ' school seismometers'
        + (nearest ? ' · nearest: ' + esc(nearest.site || nearest.code) + ' (' + nearest.dist_km + ' km)' : '')
        + (e.depth != null ? ' · depth ' + Math.round(e.depth) + ' km' : '') + '</div>'
        + '<img class="section-img" loading="lazy" alt="Record section for this earthquake across ' + n + ' schools" '
        + 'src="' + RAW + encodeURIComponent(e.event_id) + '.png?v=' + hourStamp() + '">'
        + '<div class="actions">'
        + '<a href="' + BASE + 'AuSIS_Map.html#quake=' + encodeURIComponent(e.event_id) + '" target="_blank" rel="noopener">See it on the map &rarr;</a>'
        + '<a href="' + BASE + 'widgets/event.html?id=' + encodeURIComponent(e.event_id) + '" target="_blank" rel="noopener">Class worksheet &rarr;</a>'
        + ga + '</div></div>';
    }).join('');
    document.getElementById('sub').textContent =
      evs.length + ' event' + (evs.length > 1 ? 's' : '') + ' in the last 30 days · updates automatically';
  })
  .catch(function() {
    document.getElementById('feed').innerHTML =
      '<div class="empty">Event data not available right now — try again shortly.</div>';
  });
</script>
</body>
</html>
