<!DOCTYPE html>
<!--
  widgets/event.html?id=ga2026ndzjfe
  Printable class worksheet for one recorded earthquake: the record section
  with P/S marks, the event facts, and the classic S−P exercise (measure the
  gap, estimate the distance, check against the printed distances). Entirely
  generated from the published event manifest + quake store — a fresh
  worksheet exists for every event within hours, automatically.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuSIS earthquake worksheet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, Helvetica, sans-serif; background: #e5e7eb; color: #374151; }
.toolbar { padding: 12px; text-align: center; }
.toolbar button { font-family: inherit; font-size: 14px; padding: 8px 22px; cursor: pointer; background: #282572; color: #fff; border: none; border-radius: 6px; }
.toolbar select { font-family: inherit; font-size: 13px; padding: 7px; margin-right: 8px; border-radius: 6px; border: 1px solid #cbd5e1; max-width: 60%; }
.page { width: 210mm; min-height: 296mm; margin: 0 auto 20px; background: #fff; padding: 14mm 15mm; }
.head { display: flex; align-items: center; gap: 6mm; border-bottom: 3px solid #f0b34e; padding-bottom: 4mm; }
.head img { height: 18mm; }
.head img.partner { height: 13mm; margin-left: auto; }
.head h1 { font-size: 16pt; color: #282572; line-height: 1.3; }
.head .sub { font-size: 10pt; color: #6b7280; margin-top: 1mm; }
.nameline { margin-top: 4mm; font-size: 10.5pt; color: #6b7280; }
.nameline span { display: inline-block; border-bottom: 1px solid #9ca3af; min-width: 55mm; margin-right: 8mm; }
.facts { display: flex; flex-wrap: wrap; gap: 3mm; margin-top: 5mm; }
.fact { border: 1px solid #e2e8f0; border-radius: 3mm; padding: 2.5mm 4mm; font-size: 10pt; }
.fact b { color: #282572; }
.section-img { width: 100%; height: auto; margin-top: 5mm; border: 1px solid #e2e8f0; }
h2 { font-size: 12pt; color: #b45309; margin-top: 6mm; }
ol.tasks { margin: 3mm 0 0 6mm; font-size: 10.5pt; line-height: 1.75; }
ol.tasks li { margin-bottom: 2.5mm; }
.blank { display: inline-block; border-bottom: 1px solid #9ca3af; min-width: 22mm; }
.hint { font-size: 9pt; color: #94a3b8; margin-top: 4mm; line-height: 1.5; }
.err { padding: 20mm; text-align: center; color: #b45309; font-size: 13pt; }
@media print { body { background: #fff; } .toolbar { display: none; } .page { margin: 0; width: auto; min-height: auto; } }
</style>
</head>
<body>
<div class="toolbar">
  <select id="picker" title="Choose a recorded earthquake"></select>
  <select id="level" title="Choose the year level">
    <option value="junior">Years 1&ndash;4</option>
    <option value="middle" selected>Years 5&ndash;8</option>
    <option value="senior">Years 9&ndash;12</option>
  </select>
  <button onclick="window.print()">Print worksheet</button>
</div>
<div class="page" id="page"><div class="err">Loading&hellip;</div></div>
<script>
const RAW = 'https://raw.githubusercontent.com/AuScope/AuScope_Outreach/event-waveforms/';
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function hourStamp() { return new Date().toISOString().slice(0, 13).replace(/[-T]/g, ''); }

(async function() {
  const params = new URLSearchParams(window.location.search);
  let id = (params.get('id') || '').replace(/[^A-Za-z0-9_-]/g, '');
  const LEVEL = ['junior', 'middle', 'senior'].includes(params.get('level'))
    ? params.get('level') : 'middle';
  document.getElementById('level').value = LEVEL;
  document.getElementById('level').addEventListener('change', function() {
    const u = new URLSearchParams(window.location.search);
    u.set('level', this.value);
    window.location.search = u.toString();
  });
  const m = await (await fetch(RAW + 'manifest.json?v=' + hourStamp())).json();
  const events = (m.events || []).slice()
    .sort((a, b) => Date.parse(b.origin) - Date.parse(a.origin));
  if (!events.length) {
    document.getElementById('page').innerHTML = '<div class="err">No recorded earthquakes available right now.</div>';
    return;
  }
  const picker = document.getElementById('picker');
  picker.innerHTML = events.map(e =>
    '<option value="' + esc(e.event_id) + '">M' + Number(e.mag).toFixed(1) + ' — '
    + esc(e.place) + ' (' + esc(String(e.origin).slice(0, 10)) + ')</option>').join('');
  if (!id || !events.some(e => e.event_id === id)) id = events[0].event_id;
  picker.value = id;
  picker.addEventListener('change', () => {
    window.location.search = '?id=' + encodeURIComponent(picker.value);
  });

  const e = events.find(x => x.event_id === id);
  const when = new Date(e.origin);
  const isLocal = e.mode !== 'tele';
  const n = (e.stations || []).length;
  const nearest = (e.stations || []).slice().sort((a, b) => a.dist_km - b.dist_km)[0];
  document.title = 'AuSIS worksheet — M' + Number(e.mag).toFixed(1) + ' ' + e.place;

  const hintFoot = 'Predicted arrivals use the iasp91 Earth model — real arrivals can differ by a second or two, ' +
    'which is itself worth discussing. The grey dashed line marks the arrival that usually carries the BIGGEST ' +
    'shaking (Lg crust-guided waves locally; surface waves for distant quakes) — it always follows S. ' +
    'More activities: sites.google.com/view/ausis2';

  const TASKS = {
    local: {
      junior: `
        <h2>Wiggle detectives (Years 1–4)</h2>
        <ol class="tasks">
          <li><b>Circle</b> the school that felt the earthquake first. Hint: it's the one whose wiggles start
              closest to the solid red line.</li>
          <li>The red line shows the moment the earthquake happened underground. Did any school feel it at that
              exact moment? Why do you think the shaking took time to arrive?
              <span class="blank" style="min-width:60mm"></span></li>
          <li>With a ruler, join the start of the wiggles on each line, top to bottom. Is your line straight up
              and down, or does it lean? Which way?</li>
          <li>Which school had the <b>biggest</b> wiggle? Was it the closest one? <span class="blank"></span></li>
        </ol>
        <div class="hint">Teacher notes: the leaning line IS wave travel — shaking spreads out like ripples in a pond,
          about 3–8 km every second. ${hintFoot}</div>`,
      middle: `
        <h2>Your turn: how far away was it? (Years 5–8)</h2>
        <ol class="tasks">
          <li>Pick a school lane. The <b style="color:#2563eb">blue dashed line</b> is the predicted arrival of the
              <b>P wave</b> (fast, arrives first). The <b style="color:#dc2626">red dashed line</b> is the
              <b>S wave</b> (slower). Read the time between them off the axis:
              S − P = <span class="blank"></span> seconds.</li>
          <li>Multiply by 8. Seismologists' rule of thumb: every second of S−P gap ≈ 8 km of distance.
              Your distance estimate: <span class="blank"></span> km.</li>
          <li>Compare with the real distance printed at the bottom-left of that lane:
              <span class="blank"></span> km. How close were you?</li>
          <li>The <b style="color:#6b7280">grey dashed line (Lg)</b> marks where the biggest shaking usually
              arrives — waves bouncing along inside the crust. Does the biggest wiggle in your lane land near it?</li>
          <li>Look across all ${n} schools, nearest at the top. What happens to the S−P gap as distance grows?
              Why? <span class="blank" style="min-width:60mm"></span></li>
        </ol>
        <div class="hint">Teacher notes: P ~6–8 km/s, S ~3.5–4.5 km/s in the crust; the ×8 rule comes from
          (Vp·Vs)/(Vp−Vs) ≈ 8. ${hintFoot}</div>`,
      senior: `
        <h2>Locating an earthquake from first principles (Years 9–12)</h2>
        <ol class="tasks">
          <li>Measure S − P (seconds) for <b>three</b> lanes and tabulate against the printed distances.
              Compute d ÷ (S−P) for each: <span class="blank"></span>, <span class="blank"></span>,
              <span class="blank"></span> km/s. How consistent is it?</li>
          <li>Derive that constant: if waves leave together, show the separation after distance d is
              d(1/V<sub>s</sub> − 1/V<sub>p</sub>), so d = (S−P) · V<sub>p</sub>V<sub>s</sub>/(V<sub>p</sub>−V<sub>s</sub>).
              Evaluate with V<sub>p</sub> = 6.4, V<sub>s</sub> = 3.7 km/s.</li>
          <li>The origin time is ${esc(when.toISOString().slice(11, 19))} UTC (solid red line). Using the nearest
              lane (${nearest ? esc(nearest.site || nearest.code) + ', ' + nearest.dist_km + ' km' : '—'}), estimate
              V<sub>p</sub> directly: <span class="blank"></span> km/s.</li>
          <li>The biggest amplitudes arrive at the <b style="color:#6b7280">grey Lg mark</b> (≈3.5 km/s), after
              direct S. Lg is shear energy trapped in the crustal waveguide. Why would guided waves lose energy
              more slowly with distance than body waves? (Hint: spreading in 2D vs 3D.)</li>
          <li>One S−P time gives a distance, not a location. How many stations do you need to find the epicentre,
              and how would you construct it? Sketch on the back.</li>
        </ol>
        <div class="hint">Teacher notes: expect d/(S−P) ≈ 8–9 km/s on cratonic paths (Australian crust is fast —
          predictions from a global average model run a touch late here, a good uncertainty discussion).
          ${hintFoot}</div>`,
    },
    tele: {
      junior: `
        <h2>Waves from far away (Years 1–4)</h2>
        <ol class="tasks">
          <li>This earthquake happened near <b>${esc(e.place)}</b> — find it on a globe or map.
              It is about <b>${nearest ? Math.round(nearest.dist_km / 100) * 100 : '—'} km</b> from the nearest
              school on this page!</li>
          <li>The waves travelled all that way through the Earth. About how long do you think they took —
              seconds, minutes, or hours? Circle your guess, then check with your teacher using the marks.</li>
          <li>Nobody at these schools felt anything — the ground moved less than the width of a hair. What
              instrument "felt" it for us? <span class="blank"></span></li>
          <li>Which school's wiggle looks biggest to you? Put a star on it.</li>
        </ol>
        <div class="hint">Teacher notes: the P wave took roughly ${nearest ? Math.round(nearest.dist_km / 10 / 60) : '—'}
          minutes (mantle P averages ~10 km/s over these paths). ${hintFoot}</div>`,
      middle: `
        <h2>Your turn: waves across the planet (Years 5–8)</h2>
        <ol class="tasks">
          <li>The <b style="color:#2563eb">blue dashed line</b> marks the predicted <b>P wave</b> arrival. About
              how many <b>minutes</b> after the earthquake (solid red line) did it arrive?
              <span class="blank"></span></li>
          <li>Estimate the P wave's average speed: distance ÷ time = <span class="blank"></span> km/s.
              (A jet airliner does ~0.25 km/s. How many times faster is the wave?)</li>
          <li>The biggest slow rolling wiggles arrive near the <b style="color:#6b7280">grey dashed line</b> —
              these are <b>surface waves</b>. Roughly how long after P did they arrive? <span class="blank"></span> minutes.</li>
          <li>The wiggles are measured in µm/s — millionths of a metre per second. Nobody felt anything. What
              does that tell you about the seismometer? <span class="blank" style="min-width:55mm"></span></li>
        </ol>
        <div class="hint">Teacher notes: teleseismic P dives through the mantle at 8–13 km/s; surface waves skim
          the outside at ~4 km/s, which is why they arrive so much later. ${hintFoot}</div>`,
      senior: `
        <h2>Probing the deep Earth (Years 9–12)</h2>
        <ol class="tasks">
          <li>Measure the P travel time from origin (red) to the blue mark: <span class="blank"></span> s.
              Average speed over ${nearest ? nearest.dist_km : '—'} km: <span class="blank"></span> km/s.
              Crustal P is ~6 km/s — what does the higher average tell you about the mantle, and why does
              wave speed rise with depth?</li>
          <li>Surface waves (grey mark) average ≈4 km/s along the surface. Verify from the plot, and explain
              why the P–surface gap grows with distance while carrying most of the energy.</li>
          <li>This was M${Number(e.mag).toFixed(1)}. Radiated energy scales as 10<sup>1.5M</sup> — compute how
              many times more energy this released than a local M3.0: <span class="blank"></span>.</li>
          <li>The display is band-passed 0.02–0.1 Hz (periods 10–50 s). Why do long periods survive
              ${nearest ? Math.round(nearest.dist_km / 1000) : '—'},000 km better than the 1 Hz energy a nearby
              quake shows? (Consider attenuation and scattering.)</li>
          <li>Estimate arrival-time uncertainty: the marks assume the iasp91 global model and the catalogue depth
              (${esc(String(e.depth != null ? e.depth : 'unknown'))} km). Name two reasons the real onset could differ
              by a few seconds.</li>
        </ol>
        <div class="hint">Teacher notes: ΔM of ${(Number(e.mag) - 3).toFixed(1)} → energy ratio
          10^${(1.5 * (Number(e.mag) - 3)).toFixed(1)}. ${hintFoot}</div>`,
    },
  };
  const tasksLocal = TASKS.local[LEVEL];
  const tasksTele = TASKS.tele[LEVEL];

  document.getElementById('page').innerHTML = `
    <div class="head">
      <img src="../assets/ausis-logo.png" alt="AuSIS">
      <div>
        <h1>Earthquake worksheet: M${Number(e.mag).toFixed(1)} — ${esc(e.place)}</h1>
        <div class="sub">Recorded by ${n} AuSIS school seismometers · ${esc(when.toUTCString())}</div>
      </div>
      <img class="partner" src="../assets/2025_AuScope_Logo_Icon-Colour.png" alt="AuScope">
    </div>
    <div class="nameline">Name: <span></span> Class: <span></span> Date: <span></span></div>
    <div class="facts">
      <div class="fact"><b>Magnitude</b> ${Number(e.mag).toFixed(1)}</div>
      <div class="fact"><b>When (UTC)</b> ${esc(e.origin)}</div>
      <div class="fact"><b>Type</b> ${isLocal ? 'Australian region' : 'Distant (teleseismic)'}</div>
      <div class="fact"><b>Nearest school shown</b> ${nearest ? esc(nearest.site || nearest.code) + ' — ' + nearest.dist_km + ' km' : '—'}</div>
    </div>
    <img class="section-img" alt="Seismic record section with predicted P and S arrivals"
         src="${RAW + encodeURIComponent(e.event_id)}.png?v=${hourStamp()}">
    ${isLocal ? tasksLocal : tasksTele}`;
})().catch(err => {
  document.getElementById('page').innerHTML = '<div class="err">Could not load: ' + esc(err && err.message ? err.message : err) + '</div>';
});
</script>
</body>
</html>
